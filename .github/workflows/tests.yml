name: Reference tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install locked development environment
        run: uv sync --project backend --locked --all-extras
      - name: Run reference tests
        working-directory: backend
        run: uv run --locked --all-extras python -m pytest tests -p no:cacheprovider
      - name: Check integration lint
        working-directory: backend
        run: >-
          uv run --locked --all-extras ruff check --config pyproject.toml
          src/assurance/controlspec/openshell_demo
          tests/controlspec/test_openshell_engine.py
          tests/controlspec/test_openshell_middleware.py
          tests/controlspec/test_openshell_recording.py
          ../scripts/build_openshell_demo.py ../scripts/build_runtime_demo.py
          ../integrations/openshell/runtime/bootstrap.py
          ../integrations/openshell/runtime/probe.py --exclude '*_pb2*'
      - name: Check reference and integration types
        working-directory: backend
        run: uv run --locked --all-extras mypy --package assurance --exclude 'openshell_demo/proto'

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "controlspec-reference"
version = "0.1.2.dev1"
description = "Experimental portable controls for agent actions"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.140.0",
  "pydantic>=2.11,<3",
  "rfc8785>=0.1.4,<1",
  "ruamel.yaml>=0.18,<0.19",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools==1.78.0",
  "httpx2==2.12.0",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-grpcio>=1.84.0.20260928",
  "types-protobuf>=7.35.1.20260906",
]
openshell = [
    "grpcio==1.78.0",
    "protobuf>=6.31.1,<7",
    "pyjwt[crypto]>=2.10,<3",
]
smolagents = [
    "smolagents>=1.26,<1.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assurance"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
packages = ["assurance"]

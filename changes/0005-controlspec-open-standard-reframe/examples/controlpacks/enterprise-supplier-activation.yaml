      verdict: block
      route:
        schema: controlspec/v0/route
        schema_version: 0.1.0
        namespace: enterprise.supplier.activation
        route_id: block-unknown-classification
        kind: block
        target_ref: null
        parameters: {}
        requires_recheck: false
        extensions: {}
      code: enterprise.supplier.classification_missing
    effect:
      verdict: require_approval
      route:
        schema: controlspec/v0/route
        schema_version: 0.1.0
        namespace: enterprise.supplier.activation

namespace: enterprise.supplier.activation
pack_id: supplier-activation-reference
name: Enterprise supplier activation
version: 0.1.0
status: draft
title: Enterprise Supplier Activation
description: Non-authoritative example aligned with RiskSpec; no executable runtime support is claimed.
controls:
  - schema: controlspec/v0/control
    schema_version: 0.1.0
    namespace: enterprise.supplier.activation
    control_id: supplier-evidence-and-approval
    version: 0.1.0
    status: draft
    effective_from: null
    effective_until: null
    title: Supplier evidence and approval
    description: High-risk or restricted-data suppliers follow a human review route.
    owner_ref: null
    source_refs: []
    match:
      actor_types: [agent]
      action_types: [modify]
      domain_actions: [enterprise.supplier.activate]
      resource_types: [enterprise.supplier]
      predicates:
        - operator: eq
          path: /context/enterprise.supplier.high_risk
          value: true
          values: []
          expected: null
    on_unknown:
      verdict: block
      route:
        schema: controlspec/v0/route
        schema_version: 0.1.0
        namespace: enterprise.supplier.activation
        route_id: block
        kind: block
        target_ref: null
        parameters: {}
        requires_recheck: false
        extensions: {}
      code: enterprise.supplier.missing_context
    effect:
      verdict: route
      route:
        schema: controlspec/v0/route
        schema_version: 0.1.0
        namespace: enterprise.supplier.activation
        route_id: human-review
        kind: human_review
        target_ref: null
        parameters: {}
        requires_recheck: true
        extensions: {}
      requirements:
        - requirement_id: independent-approval
          requirement_type: approval
          role: enterprise.supplier.role.approver
          scope: {enterprise.supplier.activation: exact_intent}
          minimum_count: 1
          validity_seconds: 3600
          separate_from_actor: true
          separate_from_roles: [enterprise.supplier.role.proposer]
          failure:
            verdict: require_approval
            route: null
            code: enterprise.supplier.approval_required
        - requirement_id: supplier-evidence
          requirement_type: evidence
          kind: enterprise.supplier.evidence.complete
          subject: enterprise.supplier
          minimum_count: 1
          max_age_seconds: null
          verifier: enterprise.supplier.evidence.valid
          separation:
            producer_not_actor: false
            certifier_not_actor: true
            producer_certifier_distinct: true
          failure:
            verdict: block
            route:
              schema: controlspec/v0/route
              schema_version: 0.1.0
              namespace: enterprise.supplier.activation
              route_id: block-evidence
              kind: block
              target_ref: null
              parameters: {}
              requires_recheck: false
              extensions: {}
            code: enterprise.supplier.evidence_missing
      conditions: []
      code: enterprise.supplier.human_route
    metadata: {profile: riskspec_enterprise_supplier}
    semantic_digest: null
    extensions: {}

        target_ref: null
        parameters: {}
        requires_recheck: false
        extensions: {}
      requirements:
        - requirement_id: routine-supplier-evidence
          requirement_type: evidence
          kind: enterprise.supplier.evidence.complete
          subject: enterprise.supplier
          minimum_count: 1
          max_age_seconds: null
          verifier: enterprise.supplier.evidence.valid
          separation:
            producer_not_actor: false
            certifier_not_actor: true
            producer_certifier_distinct: true
          failure:

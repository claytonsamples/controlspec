              schema_version: 0.1.0
              namespace: enterprise.supplier.activation
              route_id: block-routine-evidence
              kind: block
              target_ref: null
              parameters: {}
              requires_recheck: false
              extensions: {}
            code: enterprise.supplier.evidence_missing
      conditions: []
      code: enterprise.supplier.routine_controlled
    metadata: {profile: riskspec_enterprise_supplier}
    semantic_digest: null
    extensions: {}
